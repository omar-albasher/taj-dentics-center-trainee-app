name: trainee_app
description: "Taj Dentics Training Center - Trainee App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.2.3
  mobile_scanner: ^7.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  file_saver: ^0.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/ArbFONTS-Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/ArbFONTS-Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/ArbFONTS-Cairo-Black.ttf
          weight: 900